[package]
name = "denice-loader"
description = "The Denice loader (`denice`): starts the highest installed version, restarts into newer ones, falls back from broken ones, and hands over to a replaced loader."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "denice"
path = "src/main.rs"

[dependencies]
denice-core.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
