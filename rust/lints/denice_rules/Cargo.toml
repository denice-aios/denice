[package]
name = "denice_rules"
version = "0.1.0"
description = "Denice's custom Rust rules R1-R12 (rust/RULES.md), the counterparts of the C# analyzers."
edition = "2024"
license = "MIT"
authors = ["Denice.ai"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "6.4.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.4.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
