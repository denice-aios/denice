# The one pin for the Rust toolchain (as global.json pins the .NET SDK). CI and local builds both read it.
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
