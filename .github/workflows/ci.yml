name: CI

# The full pipeline: the quality gate (build + test all six RIDs' code, run the four test legs, one gate job
# PRs must pass) PLUS, on a push to dev/main only, signing and a release.
#
# Version id: one leading `version` job computes it once (compute-version-once) and passes it to every OS job
# and the release job as -p:Denice* args / outputs, so all jobs stamp the identical id. dev => -pre-release,
# main => none.
#
# Signing (push only, decision signing-mechanisms): each OS job strong-name-signs its build (from the
# DENICE_STRONGNAME_SNK secret; DENICE_REQUIRE_SIGNED makes a missing key a hard fail so CI never ships
# unsigned — no-committed-keys), then codesign (mac) / the Windows signing hand-off (.github/actions/windows-sign:
# today signtool+timestamp with the test certificate, later SignPath) / cosign-keyless (all six) its two install
# layouts, checksum and cosign them, and upload them. The release job gathers all six and publishes one
# release: pre-release from dev, full release from main (channel-by-prerelease-id).
#
# What ships (Tim, 14-16 November 2026; rust/REQUIREMENTS.md): per platform one install layout, built by
# eng/build-install-layout.sh from ONE build id for both halves: the Rust loader `denice`, and versions/<version>/ with
# the versioned Rust entry `denice-v<version>-<rid>` (named by the build itself), Denice Runtime (.NET, a DLL) with its
# self-contained runtime, and the loader that version carries. Each OS job also runs the Rust gate (eng/rust-checks.sh)
# and the end-to-end loader test (eng/loader-e2e-test.sh) on its native platform.
#
# A single runner cannot host both `codesign` (macOS-only) and `signtool` (Windows-only), so each OS job
# verifies its own native signature right after signing (a hard `needs:` dependency of the release), and the
# release job — on macOS — re-verifies the mac codesign seals plus every cosign signature (the one cross-platform
# check). Nothing publishes if any of these fail (verify-sigs-before-publish).
#
# The .NET SDK version is read straight from global.json (dotnet-install --jsonfile) so the pin has ONE source (pin-sdk-10.0.100-ga, moved to the current patch after the macOS 26 upgrade); installed with Microsoft's official dotnet-install script,
# the same script used locally. Every third-party action is pinned by immutable commit id (pin-actions-by-commit-id).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Which keys sign each OS (docs/signing-switchover.md). Each is a repository variable (Settings > Secrets and variables >
# Actions > Variables); unset means `test`, the self-signed CI certificates. Moving to the real keys is a change of
# settings, not of this file: set the new secrets, then flip the variable.
#   DENICE_MACOS_SIGNING    test | developer-id  (developer-id: codesign --timestamp, notarize + staple the app and DMG)
#   DENICE_WINDOWS_SIGNING  test | signpath      (signpath: the signing hand-off goes to SignPath instead of signtool)
env:
  DENICE_MACOS_SIGNING: ${{ vars.DENICE_MACOS_SIGNING || 'test' }}
  DENICE_WINDOWS_SIGNING: ${{ vars.DENICE_WINDOWS_SIGNING || 'test' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.id.outputs.day }}
      time: ${{ steps.id.outputs.time }}
      combined: ${{ steps.id.outputs.combined }}
      hash: ${{ steps.id.outputs.hash }}
      channel: ${{ steps.id.outputs.channel }}
      # The single assembled version string (compute-build-id.sh is its sole owner): `tag` = MSBuild Version /
      # release tag (no +hash), `version` = SemVer / InformationalVersion (with +hash). Every downstream job
      # consumes these — no job re-reads version.props or re-applies -pre-release (compute-version-once).
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: id
        # pull_request => channel 'pr-<number>' (pr-build-version-channel: a PR build is not a pre-release, and the
        # number makes each build's evidence identifiable). push to dev => 'dev'; push to main => '' (no prerelease).
        run: eng/compute-build-id.sh "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/dev' && 'dev' || '') }}"

  macos:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable),
          # so it prints the exact pinned version and hard-fails if that version is not the one installed.
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/macos-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Build both mac install layouts (loader + versioned entry + Denice Runtime)
        run: |
          eng/build-install-layout.sh osx-arm64 layouts/osx-arm64
          eng/build-install-layout.sh osx-x64 layouts/osx-x64
      - name: Cross-RID selects exactly one platform library (host != target)
        # Regression guard for scan-resolutions #1: a self-contained cross-RID publish must reference and bundle
        # exactly ONE Denice.CrossPlatform.<OS> library. The per-OS legs can never catch a mis-selection
        # because each job's host matches its RID; this runs a TRUE cross-build (macOS host -> linux-x64 target).
        #
        # -m:1 (single MSBuild node) is load-bearing, not a preference. A self-contained cross-RID publish evaluates
        # the same projects twice — once with the RuntimeIdentifier set and once with the SDK's RID stripped for the
        # app's library references — and both instances write the SAME bin/Release/net10.0 output, because that path
        # does not vary by RID. Reproduced locally: a plain `dotnet build` builds every project once, while this
        # publish builds 5 of 7 twice. On parallel nodes the two writers can hit one generated file in the same
        # instant, which fails the step with "GenerateDepsFile ... deps.json ... used by another process" (seen on
        # the dev merge of PR #52, run 33440630677). Serializing removes the race; the underlying double-build is
        # issue #56, and this flag comes out when that is fixed.
        run: eng/check-single-platform-lib.sh linux-x64 -m:1 $AG
      - name: Test osx-arm64 (native)
        run: dotnet test -c Release $AG --logger "trx;LogFileName=macos-native.trx"
      - name: Test osx-x64 under Rosetta (must run as X64)
        # The detailed console logger surfaces ProcessArchitectureTests' "ProcessArchitecture=X64" line in the
        # CI log (Acceptance 6); DENICE_EXPECT_ARCH=X64 makes the test itself fail if this leg did not truly
        # land on x64 under Rosetta — teeth beyond a log grep (decision intel-mac-via-rosetta).
        env:
          DENICE_EXPECT_ARCH: X64
        run: |
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --architecture x64 --install-dir "$RUNNER_TEMP/dotnet-x64"
          DOTNET_ROOT="$RUNNER_TEMP/dotnet-x64" arch -x86_64 "$RUNNER_TEMP/dotnet-x64/dotnet" test -c Release $AG -l "console;verbosity=detailed" --logger "trx;LogFileName=macos-rosetta.trx"
      - name: Coverage gate — macOS implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # `dotnet test` collected cobertura coverage by default (the shared .runsettings). Gate the per-OS macOS
        # implementation on its own leg; the aggregate is gated once on the Linux leg.
        run: eng/coverage-gate.sh . Denice.CrossPlatform.MacOS
      - name: End-to-end loader test on osx-arm64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        run: eng/loader-e2e-test.sh osx-arm64 "$RUNNER_TEMP/e2e"
      - name: Install script tests (macOS and the Linux branch; temporary HOME, no network; rust/REQUIREMENTS.md I3 I4 I6)
        run: eng/install/test-install.sh
      - name: Install the real osx-arm64 layout with the install script, run it, find it from a new login shell's PATH, uninstall (pkg-d4e90c3ce176; rust/REQUIREMENTS.md I3 I5)
        run: eng/install/test-real-install.sh osx-arm64 layouts/osx-arm64 "$RUNNER_TEMP/real-install"
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-macos
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Sign mac binaries (codesign, hardened runtime + entitlements)
        # DENICE_MACOS_CERT_P12 holds the test certificate today and the Developer ID Application certificate after the
        # switch (docs/signing-switchover.md); the steps are the same, except that a Developer ID signature also gets
        # Apple's secure timestamp (--timestamp), which notarization requires and which a self-signed cert cannot get.
        if: github.event_name == 'push'
        env:
          P12_B64: ${{ secrets.DENICE_MACOS_CERT_P12 }}
          P12_PW: ${{ secrets.DENICE_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          case "$DENICE_MACOS_SIGNING" in
            test) TS=""; echo "::notice::macOS signing: TEST certificate (self-signed, untrusted; no timestamp, not notarized). Set the repository variable DENICE_MACOS_SIGNING=developer-id to sign with the Developer ID." ;;
            developer-id) TS="--timestamp" ;;
            *) echo "::error::DENICE_MACOS_SIGNING is '$DENICE_MACOS_SIGNING'; it must be 'test' or 'developer-id' (docs/signing-switchover.md)."; exit 1 ;;
          esac
          WORK="$RUNNER_TEMP/macsign"; mkdir -p "$WORK"
          printf '%s' "$P12_B64" | openssl base64 -d -A > "$WORK/cert.p12"
          # ci-cert-expiry-check: fail the build if the CI signing cert is already expired. The p12->PEM
          # modern-then-legacy fallback lives in one place (eng/p12-to-pem.sh) shared with the release export.
          eng/p12-to-pem.sh "$WORK/cert.p12" "$P12_PW" "$WORK/cert.pem"
          if ! openssl x509 -in "$WORK/cert.pem" -checkend 0 -noout; then
            echo "::error::DENICE_MACOS_CERT_P12 is expired — regenerate the CI signing cert (decision ci-cert-expiry-check)."
            exit 1
          fi
          KC="$WORK/build.keychain-db"; KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$WORK/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -A
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          # The CI cert is a self-signed, UNTRUSTED code-signing cert, so `find-identity -v` (valid-only) returns
          # "0 valid identities found" (CSSMERR_TP_NOT_TRUSTED) and the old awk picked the word "valid", making
          # `codesign --sign valid` fail with "valid: no identity found". codesign does NOT need the cert trusted,
          # only present, so select the imported identity by its SHA-1 (list WITHOUT -v). codesign --verify --strict
          # (the verify step) is a structural seal check and likewise needs no trust.
          IDENTITY="$(security find-identity -p codesigning "$KC" | grep -oE '[0-9A-F]{40}' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "::error::No code-signing identity found in the build keychain after import."; exit 1; fi
          # The DMG step signs with the same identity, keychain and timestamp choice (none of these is secret).
          { echo "DENICE_MAC_IDENTITY=$IDENTITY"; echo "DENICE_MAC_KEYCHAIN=$KC"; echo "DENICE_MAC_TIMESTAMP=$TS"; } >> "$GITHUB_ENV"
          # Denice's own executables in each layout: the loader app Denice.app (root + the copy the version carries;
          # signing the app seals its program and Info.plist) and the versioned entry, which hosts .NET and so carries
          # the JIT entitlements (decision mac-hardened-runtime). The .NET runtime's own .dylib files keep Microsoft's
          # signatures.
          for rid in osx-arm64 osx-x64; do
            L="layouts/$rid"; V="$L/versions/$DENICE_ASSET_VERSION"
            # Sign the root app once and copy it into the version: two separate signatures differ (each carries its
            # own signing time), and ci-stage-layout.sh requires the carried loader to equal the root one.
            # $TS is empty (test) or --timestamp (developer-id), so it is left unquoted on purpose.
            codesign --force --options runtime $TS --keychain "$KC" --sign "$IDENTITY" "$L/Denice.app"
            rm -rf "$V/Denice.app"; ditto "$L/Denice.app" "$V/Denice.app"
            codesign --force --options runtime $TS --entitlements eng/signing/denice.entitlements --keychain "$KC" --sign "$IDENTITY" "$V/denice-v$DENICE_ASSET_VERSION-$rid"
          done
      - name: Notarize and staple Denice.app (developer-id only; skipped with a notice on the test certificate)
        # Apple notarizes only Developer ID signatures. The root app is notarized and stapled, then copied over the
        # carried copy again, because ci-stage-layout.sh requires the carried loader to equal the root one.
        if: github.event_name == 'push'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [ "$DENICE_MACOS_SIGNING" != developer-id ]; then
            echo "::notice::macOS notarization skipped: DENICE_MACOS_SIGNING is '$DENICE_MACOS_SIGNING' (only a Developer ID signature can be notarized)."
            exit 0
          fi
          for rid in osx-arm64 osx-x64; do
            L="layouts/$rid"; V="$L/versions/$DENICE_ASSET_VERSION"
            eng/macos/notarize.sh "$L/Denice.app"
            rm -rf "$V/Denice.app"; ditto "$L/Denice.app" "$V/Denice.app"
          done
      - name: Build and sign the drag-to-Applications DMGs; notarize and staple them (developer-id only)
        # Built on the test certificate too, so the DMG build is proven before the switch; only a Developer ID DMG is
        # notarized and uploaded. The release does not publish the DMGs yet (docs/signing-switchover.md).
        if: github.event_name == 'push'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          for rid in osx-arm64 osx-x64; do
            DMG="dmg/denice-v$DENICE_ASSET_VERSION-$rid.dmg"
            # $DENICE_MAC_TIMESTAMP is empty or --timestamp (set by the signing step), so it is left unquoted.
            eng/macos/build-dmg.sh "layouts/$rid/Denice.app" "$DMG" --sign "$DENICE_MAC_IDENTITY" --keychain "$DENICE_MAC_KEYCHAIN" $DENICE_MAC_TIMESTAMP
            if [ "$DENICE_MACOS_SIGNING" = developer-id ]; then
              eng/macos/notarize.sh "$DMG"
            else
              echo "::notice::$DMG not notarized: DENICE_MACOS_SIGNING is '$DENICE_MACOS_SIGNING'."
            fi
          done
      - name: Upload the notarized DMGs (developer-id only)
        if: github.event_name == 'push' && env.DENICE_MACOS_SIGNING == 'developer-id'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-macos
          path: dmg/
          if-no-files-found: error
          retention-days: 7
      - name: Launch the codesigned mac layout (proves hardened runtime lets the loader, entry and .NET run)
        # success definition + Acceptance 5: run the codesigned, hardened-runtime osx-arm64 layout through its loader and
        # require exit 0 — the entry's entitlements (allow-jit / allow-unsigned-executable-memory) let it host .NET under
        # `codesign --options runtime` (decision mac-hardened-runtime).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # The loader finds versions in ~/Library/Application Support/Denice/versions (pkg-494745156d56
          # macos-versions), so run it with a throwaway HOME holding a copy of the signed version.
          LAUNCH_HOME="$RUNNER_TEMP/launch-home"; VERSIONS="$LAUNCH_HOME/Library/Application Support/Denice/versions"
          mkdir -p "$VERSIONS"
          ditto "layouts/osx-arm64/versions/$DENICE_ASSET_VERSION" "$VERSIONS/$DENICE_ASSET_VERSION"
          HOME="$LAUNCH_HOME" layouts/osx-arm64/Denice.app/Contents/MacOS/denice version
      - name: Install a quarantined download as a new standard (non-administrator) user, run it, Gatekeeper's verdict, uninstall (rust/REQUIREMENTS.md I10; on push the signed layout)
        run: eng/install/test-standard-user.sh osx-arm64 layouts/osx-arm64
      - name: Stage, checksum, and cosign the mac layouts
        if: github.event_name == 'push'
        run: |
          eng/ci-stage-layout.sh layouts/osx-arm64 dist osx-arm64
          eng/ci-stage-layout.sh layouts/osx-x64 dist osx-x64
      - name: Verify mac signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        run: eng/ci-verify-layout.sh verify/verify-macos.txt codesign "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist osx-arm64 osx-x64
      - name: Upload signed mac binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload mac verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-macos
          path: verify/verify-macos.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
      actions: read              # SignPath reads the handed-off artifact with this job's token (DENICE_WINDOWS_SIGNING=signpath)
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JSonFile "$env:GITHUB_WORKSPACE/global.json" -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable).
          & "$env:RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        # bash (not the default pwsh) so $AG word-splits into separate -p args, matching the mac/linux jobs;
        # under pwsh "$env:AG" is passed as ONE malformed argument and DeniceStampVersion fails the build.
        shell: bash
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/windows-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Build both windows install layouts (loader + versioned entry + Denice Runtime)
        shell: bash
        run: |
          eng/build-install-layout.sh win-x64 layouts/win-x64
          eng/build-install-layout.sh win-arm64 layouts/win-arm64
      - name: Test win-x64 (win-arm64 is build-only, accepted risk)
        shell: bash
        run: dotnet test -c Release $AG --logger "trx;LogFileName=windows.trx"
      - name: Coverage gate — Windows implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # bash so the shared gate script runs identically to the mac/linux legs. It gates the per-OS Windows
        # implementation on its own leg; the aggregate is gated once on the Linux leg.
        shell: bash
        run: eng/coverage-gate.sh . Denice.CrossPlatform.Windows
      - name: End-to-end loader test on win-x64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        shell: bash
        run: eng/loader-e2e-test.sh win-x64 "$RUNNER_TEMP/e2e"
      - name: Build both per-user Inno Setup installers (pkg-494745156d56 windows-install; rust/REQUIREMENTS.md I2)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64','win-arm64') {
            ./eng/windows/build-installer.ps1 -Rid $rid -Version $env:DENICE_VERSION -Layout "layouts/$rid" -Out installers
          }
      - name: Install, run and uninstall the win-x64 setup silently as this user (no admin; user PATH per pkg-d4e90c3ce176; rust/REQUIREMENTS.md I1 I2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The user's PATH exactly as stored (unexpanded), to compare after uninstall.
          function Get-UserPath { (Get-Item 'HKCU:\Environment').GetValue('Path', $null, 'DoNotExpandEnvironmentNames') }
          $pathBefore = Get-UserPath
          $setup = Get-ChildItem installers -Filter "denice-setup-v*-win-x64.exe" | Select-Object -First 1 -ExpandProperty FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Denice'
          $exe = Join-Path $app 'denice.exe'
          if (-not (Test-Path $exe)) { throw "denice.exe is not in $app" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Denice.lnk'
          if (-not (Test-Path $shortcut)) { throw "no Start Menu shortcut at $shortcut" }
          # Installed apps entry: per user (HKCU), never machine-wide (HKLM).
          $key = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{7CE66CF4-3F91-454E-8A78-85E7192786D9}_is1'
          if (-not (Test-Path "HKCU:\$key")) { throw "no per-user Installed apps entry at HKCU:\$key" }
          if (Test-Path "HKLM:\$key") { throw "the Installed apps entry is machine-wide" }
          & $exe settings set updates.enabled false
          $out = & $exe version
          if ($LASTEXITCODE -ne 0 -or -not ($out -match [regex]::Escape("SemVer: $env:DENICE_VERSION"))) { throw "denice version failed: $out" }
          # pkg-d4e90c3ce176 install-path: the install folder is on the user's PATH (HKCU, REG_EXPAND_SZ), once.
          $entries = @((Get-UserPath) -split ';' | Where-Object { $_ -eq $app })
          if ($entries.Count -ne 1) { throw "HKCU\Environment Path holds $app $($entries.Count) times: $(Get-UserPath)" }
          $kind = (Get-Item 'HKCU:\Environment').GetValueKind('Path')
          if ($kind -ne 'ExpandString') { throw "HKCU\Environment Path is $kind, not REG_EXPAND_SZ" }
          # A new process with the PATH a new terminal gets (machine + user, from the registry) finds and runs denice.
          $psi = [Diagnostics.ProcessStartInfo]::new('cmd.exe', '/d /c where denice && denice version')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.Environment['Path'] = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $proc = [Diagnostics.Process]::Start($psi)
          $viaPath = $proc.StandardOutput.ReadToEnd()
          $proc.WaitForExit()
          if ($proc.ExitCode -ne 0 -or -not ($viaPath -match [regex]::Escape($exe)) -or -not ($viaPath -match [regex]::Escape("SemVer: $env:DENICE_VERSION"))) { throw "a new process with the user PATH did not run denice: $viaPath" }
          # A version Denice downloaded after setup must go too (pkg-494745156d56 option text).
          $later = Join-Path $app 'versions\0.9.9-pre-release+downloaded'
          New-Item -ItemType Directory -Force -Path $later | Out-Null
          Set-Content -Path (Join-Path $later 'Denice.Runtime.dll') -Value 'downloaded later'
          $uninstaller = Get-ChildItem $app -Filter 'unins*.exe' | Select-Object -First 1 -ExpandProperty FullName
          $u = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if (Test-Path $shortcut) { throw "uninstall left the Start Menu shortcut" }
          if (Test-Path $app) { throw "uninstall left $app (including versions downloaded after setup)" }
          if (Test-Path "HKCU:\$key") { throw "uninstall left the Installed apps entry" }
          $pathAfter = Get-UserPath
          if ((@($pathAfter -split ';') | Where-Object { $_ -eq $app }).Count -ne 0) { throw "uninstall left $app on the user's PATH: $pathAfter" }
          if ($pathAfter -cne $pathBefore) { throw "uninstall changed the rest of the user's PATH: before '$pathBefore', after '$pathAfter'" }
          Write-Host "installed, ran ($out), uninstalled"
      - name: Install and run the win-x64 setup as a standard (non-administrator) user (rust/REQUIREMENTS.md I1 I10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installers -Filter "denice-setup-v*-win-x64.exe" | Select-Object -First 1 -ExpandProperty FullName
          $copy = Join-Path $env:PUBLIC 'denice-setup.exe'
          Copy-Item $setup $copy
          # As a browser download: the Mark of the Web (Internet zone), what SmartScreen and Smart App Control look at.
          Set-Content -LiteralPath $copy -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          if (-not ((Get-Content -LiteralPath $copy -Stream Zone.Identifier) -match 'ZoneId=3')) { throw 'the setup copy carries no Mark of the Web' }
          $plain = 'Dn-' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!a1'
          $password = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name 'denicestd' -Password $password -AccountNeverExpires | Out-Null
          if ((Get-LocalGroupMember -Group 'Administrators' | Where-Object Name -like '*\denicestd')) { throw 'the test user is an administrator' }
          # Run as that user through a scheduled task (its own logon session); processes started from the runner's
          # service session with other credentials cannot initialise a window station.
          $log = Join-Path $env:PUBLIC 'denice-setup-std.log'
          $out = Join-Path $env:PUBLIC 'denice-std-version.txt'
          $exe = 'C:\Users\denicestd\AppData\Local\Programs\Denice\denice.exe'
          $script = Join-Path $env:PUBLIC 'denice-std.cmd'
          Set-Content -Path $script -Encoding ascii -Value @(
            "`"$copy`" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG=`"$log`"",
            "`"$exe`" settings set updates.enabled false",
            "`"$exe`" version > `"$out`" 2>&1")
          # Windows Server grants "log on as a batch job" to no new standard user; give exactly that right, nothing else.
          $sid = (Get-LocalUser -Name 'denicestd').SID.Value
          $cfg = Join-Path $env:RUNNER_TEMP 'secpol.inf'
          secedit /export /cfg $cfg /areas USER_RIGHTS | Out-Null
          $lines = Get-Content $cfg
          if ($lines -match '^SeBatchLogonRight') {
            $lines = $lines -replace '^(SeBatchLogonRight\s*=\s*.*)$', "`$1,*$sid"
          } else {
            $lines = $lines -replace '^\[Privilege Rights\]$', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid"
          }
          Set-Content -Path $cfg -Value $lines -Encoding Unicode
          secedit /configure /db (Join-Path $env:RUNNER_TEMP 'secpol.sdb') /cfg $cfg /areas USER_RIGHTS | Out-Null
          schtasks /Create /TN DeniceStdInstall /TR "cmd.exe /c `"$script`"" /SC ONCE /ST 23:59 /RU denicestd /RP $plain /RL LIMITED /F | Out-Null
          schtasks /Run /TN DeniceStdInstall | Out-Null
          $deadline = (Get-Date).AddMinutes(5)
          do { Start-Sleep -Seconds 5; $state = (Get-ScheduledTask -TaskName DeniceStdInstall).State } while ($state -eq 'Running' -and (Get-Date) -lt $deadline)
          $result = (Get-ScheduledTaskInfo -TaskName DeniceStdInstall).LastTaskResult
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 15 | ForEach-Object { Write-Host $_ } }
          if (-not (Test-Path $exe)) { throw "no denice.exe for the standard user at $exe (task result $result)" }
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
          if (-not ($text -match [regex]::Escape("SemVer: $env:DENICE_VERSION"))) { throw "denice version as a standard user failed (task result $result): $text" }
          Write-Host "installed and ran as a standard user: $text"
          # Nothing setup installed carries the Mark of the Web, so only the downloaded setup itself meets SmartScreen.
          $marked = @(Get-ChildItem (Split-Path $exe) -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          if ($marked.Count -ne 0) { throw "installed files carry the Mark of the Web: $($marked.FullName -join ', ')" }
          Write-Host 'no installed file carries the Mark of the Web'
          # What SmartScreen and Smart App Control will weigh (docs/release-checks.md: a person checks the prompts).
          foreach ($file in @($copy, $exe)) { $sig = Get-AuthenticodeSignature -LiteralPath $file; Write-Host "Authenticode $($sig.Status) on $file ($($sig.SignerCertificate.Subject))" }
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-windows
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      # Windows signing is one bounded hand-off (.github/actions/windows-sign), run twice: unsigned files go out as an
      # artifact, come back signed, and are checked and copied into place. Only the signer inside it changes with
      # DENICE_WINDOWS_SIGNING: `test` (unset) signs with the self-signed DENICE_WINDOWS_PFX and signtool, `signpath`
      # sends the artifact to SignPath (docs/signing-switchover.md). Round 1 is Denice's own files in the layouts;
      # round 2 is the setup programs, built from the signed layouts.
      - name: Signing hand-off 1 of 2 — collect Denice's unsigned files from both layouts
        # Denice's own files in each layout: the root loader, the versioned entry and the Denice.*.dll assemblies. The
        # carried loader is not handed off: it is copied from the signed root one afterwards, because two separate
        # signatures differ (each has its own timestamp) and ci-stage-layout.sh requires the two to be equal. The .NET
        # runtime's own files keep Microsoft's signatures.
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'winsign\layouts-unsigned'
          foreach ($rid in 'win-x64','win-arm64') {
            $layout = "layouts\$rid"; $versionRel = "versions\$env:DENICE_ASSET_VERSION"
            $rels = @('denice.exe', "$versionRel\denice-v$env:DENICE_ASSET_VERSION-$rid.exe") +
                    @(Get-ChildItem -Path (Join-Path $layout $versionRel) -Filter 'Denice.*.dll' | ForEach-Object { "$versionRel\$($_.Name)" })
            foreach ($rel in $rels) {
              $dest = Join-Path $out "$rid\$rel"
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              Copy-Item -LiteralPath (Join-Path $layout $rel) -Destination $dest
            }
          }
          Get-ChildItem -Path $out -Recurse -File | ForEach-Object { Write-Host "hand off: $($_.FullName.Substring($out.Length + 1))" }
      - name: Signing hand-off 1 of 2 — sign Denice's files and put them back into the layouts
        if: github.event_name == 'push'
        uses: ./.github/actions/windows-sign
        with:
          artifact-name: windows-sign-layouts
          unsigned-dir: ${{ runner.temp }}/winsign/layouts-unsigned
          signed-dir: ${{ runner.temp }}/winsign/layouts-signed
          restore-to: ${{ github.workspace }}/layouts
          mode: ${{ env.DENICE_WINDOWS_SIGNING }}
          pfx-base64: ${{ secrets.DENICE_WINDOWS_PFX }}
          pfx-password: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signpath-organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          signpath-project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'denice' }}
          signpath-signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          signpath-artifact-configuration-slug: ${{ vars.SIGNPATH_FILES_CONFIGURATION_SLUG || 'denice-files' }}
      - name: Carry the signed root loader into each version folder (ci-stage-layout.sh requires them equal)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($rid in 'win-x64','win-arm64') {
            $layout = "layouts\$rid"
            Copy-Item -Force (Join-Path $layout 'denice.exe') (Join-Path $layout "versions\$env:DENICE_ASSET_VERSION\denice.exe")
          }
      - name: Signing hand-off 2 of 2 — rebuild the setup programs from the signed layouts and collect them
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force installers -ErrorAction SilentlyContinue
          foreach ($rid in 'win-x64','win-arm64') {
            ./eng/windows/build-installer.ps1 -Rid $rid -Version $env:DENICE_VERSION -Layout "layouts/$rid" -Out installers
          }
          $out = Join-Path $env:RUNNER_TEMP 'winsign\setup-unsigned'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path 'installers\denice-setup-*.exe' -Destination $out
          Get-ChildItem -Path $out -File | ForEach-Object { Write-Host "hand off: $($_.Name)" }
      - name: Signing hand-off 2 of 2 — sign the setup programs and put them back
        if: github.event_name == 'push'
        uses: ./.github/actions/windows-sign
        with:
          artifact-name: windows-sign-setup
          unsigned-dir: ${{ runner.temp }}/winsign/setup-unsigned
          signed-dir: ${{ runner.temp }}/winsign/setup-signed
          restore-to: ${{ github.workspace }}/installers
          mode: ${{ env.DENICE_WINDOWS_SIGNING }}
          pfx-base64: ${{ secrets.DENICE_WINDOWS_PFX }}
          pfx-password: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signpath-organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          signpath-project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'denice' }}
          signpath-signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          signpath-artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION_SLUG || 'denice-setup' }}
      - name: TEST CERTIFICATE ONLY — trust the self-signed cert on this runner so `signtool verify /pa` chains
        # Only for DENICE_WINDOWS_SIGNING=test: SignPath's certificate chains to a public root, so this step is skipped
        # after the switch and goes away with the test certificate. This is the RUNNER, not a tester's machine — the
        # tester 'never Root' rule (tester-trust-public-cer) governs end users, who use eng/signing/trust-cert.ps1
        # (Trusted Publishers only).
        if: github.event_name == 'push' && env.DENICE_WINDOWS_SIGNING == 'test'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DENICE_WINDOWS_PFX }}
          PFX_PW: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'wintrust'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pfx = Join-Path $work 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 @($pfx, $env:PFX_PW)
          Remove-Item -Force $pfx
          $der = Join-Path $work 'public.cer'
          [IO.File]::WriteAllBytes($der, $cert.Export('Cert'))
          Import-Certificate -FilePath $der -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $der -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
      - name: Checksum, cosign and verify the installers (push only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"
          mkdir -p dist
          for setup in installers/denice-setup-*.exe; do
            name="$(basename "$setup")"
            cp "$setup" "dist/$name"
            ( cd dist && sha256sum "$name" > "$name.sha256" && sha256sum -c "$name.sha256" )
            cosign sign-blob --yes --bundle "dist/$name.cosign.bundle" "dist/$name"
            cosign verify-blob --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "dist/$name.cosign.bundle" "dist/$name"
          done
      - name: Stage, checksum, and cosign the windows layouts
        if: github.event_name == 'push'
        shell: bash
        run: |
          eng/ci-stage-layout.sh layouts/win-x64 dist win-x64
          eng/ci-stage-layout.sh layouts/win-arm64 dist win-arm64
      - name: Verify windows signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        shell: bash
        run: eng/ci-verify-layout.sh verify/verify-windows.txt signtool "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist win-x64 win-arm64
      - name: Upload signed windows binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload windows verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-windows
          path: verify/verify-windows.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable),
          # so it prints the exact pinned version and hard-fails if that version is not the one installed.
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/linux-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Install Zig 0.15.2 and cargo-zigbuild 0.24.1 (Linux Rust programs link against glibc 2.17; pkg-2a7c75112d13)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-aarch64-linux-0.15.2.tar.xz
          echo "958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-linux-0.15.2" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked
      - name: Build both linux install layouts (loader + versioned entry + Denice Runtime)
        # cargo-zigbuild links both architectures from this arm64 runner, against glibc 2.17.
        run: |
          eng/build-install-layout.sh linux-arm64 layouts/linux-arm64
          eng/build-install-layout.sh linux-x64 layouts/linux-x64
      - name: The Linux Rust programs need no newer glibc than Denice Runtime's .NET (rust/REQUIREMENTS.md F12)
        run: |
          sudo apt-get install -y -q binutils-x86-64-linux-gnu
          eng/check-glibc.sh layouts/linux-arm64 linux-arm64
          OBJDUMP=x86_64-linux-gnu-objdump eng/check-glibc.sh layouts/linux-x64 linux-x64
      - name: Test linux-arm64 (linux-x64 is build-only, accepted risk)
        run: dotnet test -c Release $AG --logger "trx;LogFileName=linux.trx"
      - name: Coverage gate — aggregate + Linux implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # The Linux leg is where the aggregate of Engine + Cli (denice) + CrossPlatform is gated (computed once),
        # alongside the per-OS Linux implementation. `dotnet test` collected coverage by default.
        run: eng/coverage-gate.sh . aggregate Denice.CrossPlatform.Linux
      - name: End-to-end loader test on linux-arm64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        run: eng/loader-e2e-test.sh linux-arm64 "$RUNNER_TEMP/e2e"
      - name: Install script tests on Linux (temporary HOME, no network; rust/REQUIREMENTS.md I4 I6)
        run: eng/install/test-install.sh
      - name: Install the real linux-arm64 layout with the install script, run it, find it from a new login shell's PATH, uninstall (pkg-d4e90c3ce176; rust/REQUIREMENTS.md I4 I5)
        run: eng/install/test-real-install.sh linux-arm64 layouts/linux-arm64 "$RUNNER_TEMP/real-install"
      - name: Install as a new standard (non-administrator) user, check the menu entry and PATH from a new login shell, uninstall (rust/REQUIREMENTS.md I10)
        run: eng/install/test-standard-user.sh linux-arm64 layouts/linux-arm64
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-linux
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Stage, checksum, and cosign the linux layouts (no native code-signing on Linux)
        if: github.event_name == 'push'
        run: |
          eng/ci-stage-layout.sh layouts/linux-arm64 dist linux-arm64
          eng/ci-stage-layout.sh layouts/linux-x64 dist linux-x64
      - name: Verify linux signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        run: eng/ci-verify-layout.sh verify/verify-linux.txt none "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist linux-arm64 linux-x64
      - name: Upload signed linux binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload linux verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-linux
          path: verify/verify-linux.txt
          if-no-files-found: error
          retention-days: 7

  # The single check branch protection requires. It goes green only if all three OS jobs succeeded — a
  # skipped or failed OS job cannot green it.
  gate:
    needs: [macos, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every OS job succeeded
        run: |
          echo "macos=${{ needs.macos.result }} windows=${{ needs.windows.result }} linux=${{ needs.linux.result }}"
          test "${{ needs.macos.result }}" = "success" \
            && test "${{ needs.windows.result }}" = "success" \
            && test "${{ needs.linux.result }}" = "success"

  # The loader work's finish line (rust/REQUIREMENTS.md E2), as its own check (Tim, pkg-d4e90c3ce176 first-release:
  # "Publish pre-release"): it stays red, visible on every run, until every requirement row has proof; neither the
  # gate nor the release waits for it, because the release rows can only be proven from a published release.
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every loader requirement is done with evidence (rust/REQUIREMENTS.md E2; nothing is dropped quietly)
        run: eng/check-requirements.sh

  # Publishes ONE release from the six signed binaries — pre-release from dev, full release from main. Runs only
  # on a push (PRs publish nothing) and only after the gate is green (needs: gate). On macOS so it can re-verify
  # the mac codesign seals; cosign verify-blob covers all six. The assets are packaged as zips (release-zip-layout):
  # one denice-v<version>-<rid>.zip per binary plus one evidence.zip with a subdirectory per OS/platform build.
  release:
    needs: [version, gate, macos, windows, linux]
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # The assembled release tag from the single owner (the `version` job) — the release NEVER re-reads
      # version.props or re-applies -pre-release (compute-version-once / release-fields).
      TAG: ${{ needs.version.outputs.tag }}
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign (for verify-blob)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Download all six signed install layouts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Download the three per-platform verify results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verify-*
          path: verify
          merge-multiple: true
      - name: Download the per-OS build evidence (for evidence.zip)
        # No merge-multiple: each artifact lands in its own subdir (evidence-artifacts/evidence-<os>), which the
        # packaging step reorganizes into evidence.zip's one-subdirectory-per-OS-build layout (release-zip-layout).
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: evidence-artifacts
      - name: Require every per-platform verify result present and PASS (verify-sigs-before-publish)
        # Each per-OS job proved its own native signatures and emitted verify-<os>.txt. Refuse to publish unless
        # all three exist and each ends with "RESULT: PASS" — a missing or non-PASS result blocks the release.
        run: |
          set -euo pipefail
          for os in macos windows linux; do
            f="verify/verify-$os.txt"
            if [ ! -f "$f" ]; then
              echo "::error::Missing per-platform verify result $f — refusing to publish (verify-sigs-before-publish)."
              exit 1
            fi
            echo "== $f =="
            cat "$f"
            if ! grep -q "^RESULT: PASS$" "$f"; then
              echo "::error::$f is not PASS — refusing to publish (verify-sigs-before-publish)."
              exit 1
            fi
          done
      - name: Re-verify every signature before publishing (single-owner verify script)
        # verify-sigs-before-publish: re-run the SAME verifier the per-OS jobs used (eng/ci-verify-layout.sh)
        # so the cosign/codesign commands and the keyless identity have exactly one owner. cosign covers all six;
        # codesign covers the two mac RIDs (this runner is macOS). Windows Authenticode was verified in the
        # windows job, a hard `needs:` dependency of this job — no single runner hosts codesign + signtool. The
        # identity uses the same `@${{ github.ref }}` form the per-OS legs pass.
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"
          eng/ci-verify-layout.sh verify/release-macos.txt   codesign "$IDENTITY" dist osx-arm64 osx-x64
          eng/ci-verify-layout.sh verify/release-windows.txt none     "$IDENTITY" dist win-x64 win-arm64
          eng/ci-verify-layout.sh verify/release-linux.txt   none     "$IDENTITY" dist linux-arm64 linux-x64
      - name: Export the public test certs from their secrets (never drift; only for an OS still on its test certificate)
        env:
          MAC_P12_B64: ${{ secrets.DENICE_MACOS_CERT_P12 }}
          MAC_P12_PW: ${{ secrets.DENICE_MACOS_CERT_PASSWORD }}
          WIN_PFX_B64: ${{ secrets.DENICE_WINDOWS_PFX }}
          WIN_PFX_PW: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          export_cer() { # <b64> <pw> <out.cer>
            local b64="$1" pw="$2" out="$3" tmp
            tmp="$(mktemp -d)"
            printf '%s' "$b64" | openssl base64 -d -A > "$tmp/in.p12"
            # Shared p12->PEM modern-then-legacy fallback (same helper the mac cert-expiry check uses).
            eng/p12-to-pem.sh "$tmp/in.p12" "$pw" "$tmp/cert.pem"
            openssl x509 -in "$tmp/cert.pem" -outform DER -out "$out"
            rm -rf "$tmp"
          }
          # A Developer ID or SignPath signature is trusted by the OS, so testers need no certificate for that OS.
          if [ "$DENICE_MACOS_SIGNING" = test ]; then export_cer "$MAC_P12_B64" "$MAC_P12_PW" dist/denice-macos-public.cer; fi
          if [ "$DENICE_WINDOWS_SIGNING" = test ]; then export_cer "$WIN_PFX_B64" "$WIN_PFX_PW" dist/denice-windows-public.cer; fi
      - name: Stage the macOS/Linux install script and, for an OS still on its test certificate, the tester trust script
        run: |
          set -euo pipefail
          cp eng/install/install.sh dist/
          if [ "$DENICE_MACOS_SIGNING" = test ]; then cp eng/signing/trust-cert.sh dist/; fi
          if [ "$DENICE_WINDOWS_SIGNING" = test ]; then cp eng/signing/trust-cert.ps1 dist/; fi
      - name: Package the evidence zip (release-zip-layout)
        # release-zip-layout: the per-OS jobs already produced one denice-v<version>-<rid>.zip per platform (the install
        # layout, with versions/<version>/SHA256SUMS and its cosign bundle inside, the zip's own .zip.sha256 beside it).
        # Here: one evidence.zip organized with one subdirectory per OS/platform build.
        run: |
          set -euo pipefail
          rm -rf evidence-zip-root
          for os in macos windows linux; do
            src="evidence-artifacts/evidence-$os"
            if [ ! -d "$src" ]; then
              echo "::error::missing $src — the release would silently omit $os from evidence.zip" >&2
              exit 1
            fi
            mkdir -p "evidence-zip-root/$os"
            cp -R "$src/." "evidence-zip-root/$os/"
          done
          ( cd evidence-zip-root && zip -r "../dist/evidence.zip" . )
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # VERSION/tag is consumed from the single owner (the `version` job's `tag` output) — already
          # MM.combined[-pre-release] with NO +hash (decision release-fields). Only the release-kind labels are
          # derived from the channel here; the version string itself is never re-assembled.
          if [ "$CHANNEL" = "dev" ]; then
            PRERELEASE="--prerelease"; KIND="dev preview"; CHANNEL_LINE="dev preview (pre-release)"
          else
            PRERELEASE=""; KIND="release"; CHANNEL_LINE="release"
          fi
          VERSION="$TAG"
          TITLE="Denice ${VERSION} (${KIND})"
          REPO="${{ github.repository }}"
          NOTES="$RUNNER_TEMP/notes.md"
          # The certificates and trust scripts ship only for an OS still on its test certificate (docs/signing-switchover.md);
          # the ${A[@]+"${A[@]}"} form keeps an empty list safe under `set -u` on macOS's bash 3.2.
          CERTS=(); TRUST=()
          if [ "$DENICE_MACOS_SIGNING" = test ]; then CERTS+=(denice-macos-public.cer); TRUST+=(trust-cert.sh); fi
          if [ "$DENICE_WINDOWS_SIGNING" = test ]; then CERTS+=(denice-windows-public.cer); TRUST+=(trust-cert.ps1); fi
          {
            printf 'Channel: %s\n\n' "$CHANNEL_LINE"
            if [ "$DENICE_MACOS_SIGNING" = test ] && [ "$DENICE_WINDOWS_SIGNING" = test ]; then
              printf 'These binaries are signed with a self-signed, UNTRUSTED developer certificate — not a CA-issued or notarized identity. Trust our public certificate first with the attached tester trust script (`trust-cert.sh` on macOS, `trust-cert.ps1` on Windows); it trusts the cert narrowly for code signing only, never as a root.\n\n'
            else
              if [ "$DENICE_MACOS_SIGNING" = test ]; then
                printf 'The macOS binaries are signed with a self-signed, UNTRUSTED developer certificate — not a notarized identity. Trust our public certificate first with the attached tester trust script `trust-cert.sh`; it trusts the cert narrowly for code signing only, never as a root.\n\n'
              else
                printf 'The macOS binaries are signed with our Apple Developer ID and notarized by Apple.\n\n'
              fi
              if [ "$DENICE_WINDOWS_SIGNING" = test ]; then
                printf 'The Windows binaries are signed with a self-signed, UNTRUSTED developer certificate — not a CA-issued identity. Trust our public certificate first with the attached tester trust script `trust-cert.ps1`; it trusts the cert narrowly for code signing only, never as a root.\n\n'
              else
                printf 'The Windows binaries are signed through SignPath: free code signing provided by SignPath.io, certificate by SignPath Foundation.\n\n'
              fi
            fi
            printf 'How to run these alpha builds: https://github.com/%s/blob/%s/docs/running-alpha-builds.md\n\n' "$REPO" "$GITHUB_SHA"
            printf 'Built, tested, and signed from commit: https://github.com/%s/commit/%s\n' "$REPO" "$GITHUB_SHA"
          } > "$NOTES"
          cd dist
          gh release create "$VERSION" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            $PRERELEASE \
            "denice-v${DENICE_ASSET_VERSION}"-{osx-arm64,osx-x64,win-x64,win-arm64,linux-arm64,linux-x64}.zip \
            "denice-v${DENICE_ASSET_VERSION}"-{osx-arm64,osx-x64,win-x64,win-arm64,linux-arm64,linux-x64}.zip.sha256 \
            "denice-setup-v${DENICE_ASSET_VERSION}"-{win-x64,win-arm64}.exe \
            "denice-setup-v${DENICE_ASSET_VERSION}"-{win-x64,win-arm64}.exe.sha256 \
            "denice-setup-v${DENICE_ASSET_VERSION}"-{win-x64,win-arm64}.exe.cosign.bundle \
            install.sh \
            evidence.zip \
            ${CERTS[@]+"${CERTS[@]}"} \
            ${TRUST[@]+"${TRUST[@]}"}

  # Proves the rows only a PUBLISHED release can prove (rust/REQUIREMENTS.md F9 F10 F11 F14 E3, and the real-download
  # halves of E1 I5 I6), from the release the job above just published, downloaded from GitHub as a user gets it. They run
  # after publishing, so they cannot stop a release; a failure here is a defect in the published release.
  release-proof-macos:
    needs: [version, release]
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign (for verify-blob)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: The published release holds all six layouts, every checksum and cosign bundle verifies, every Denice executable is signed (rust/REQUIREMENTS.md F9 F10 F11 F14)
        run: eng/check-release.sh "$TAG" "$RUNNER_TEMP/release-check"
      - name: Denice Runtime from the release accepts the genuine osx-arm64 release and refuses altered copies (rust/REQUIREMENTS.md E3)
        if: ${{ !cancelled() }}
        run: eng/check-release-runtime.sh osx-arm64 "$RUNNER_TEMP/release-check/assets" "$RUNNER_TEMP/release-runtime"
      - name: First install from the release with `curl … install.sh | sh`, run, denice update, uninstall (rust/REQUIREMENTS.md I5 I6)
        if: ${{ !cancelled() }}
        run: eng/install/test-real-install.sh osx-arm64 "--release=$TAG" "$RUNNER_TEMP/release-install"
      - name: Install the previous release and let Denice update itself to this one through GitHub Releases (rust/REQUIREMENTS.md E1)
        if: ${{ !cancelled() }}
        run: eng/install/test-release-update.sh osx-arm64 "$TAG" "$RUNNER_TEMP/release-update"
      - name: Upload the release check result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-proof-macos
          path: ${{ runner.temp }}/release-check/check-release.txt
          if-no-files-found: error
          retention-days: 30

  release-proof-linux:
    needs: [version, release]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: Download this platform's release file (and another platform's, for its genuine cosign bundle)
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/assets" --pattern 'denice-v*-linux-*.zip' --pattern 'denice-v*-osx-x64.zip'
      - name: Denice Runtime from the release accepts the genuine ${{ matrix.rid }} release and refuses altered copies (rust/REQUIREMENTS.md E3)
        run: eng/check-release-runtime.sh ${{ matrix.rid }} "$RUNNER_TEMP/assets" "$RUNNER_TEMP/release-runtime"
      - name: First install from the release with `curl … install.sh | sh`, run, denice update, uninstall (rust/REQUIREMENTS.md I5 I6)
        if: ${{ !cancelled() }}
        run: eng/install/test-real-install.sh ${{ matrix.rid }} "--release=$TAG" "$RUNNER_TEMP/release-install"
      - name: Install the previous release and let Denice update itself to this one through GitHub Releases (rust/REQUIREMENTS.md E1)
        if: ${{ !cancelled() }}
        run: eng/install/test-release-update.sh ${{ matrix.rid }} "$TAG" "$RUNNER_TEMP/release-update"

  release-proof-windows:
    needs: [version, release]
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JSonFile "$env:GITHUB_WORKSPACE/global.json" -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP/dotnet/dotnet" --version
      - name: Windows' own verifier on the setup programs and every signed Denice file; install from the release's setup, run, denice update, uninstall; update from the previous release (rust/REQUIREMENTS.md F9 F14 I5 I6 E1)
        shell: pwsh
        run: ./eng/windows/test-release-install.ps1 -Tag $env:TAG -Work (Join-Path $env:RUNNER_TEMP 'release-install')
      - name: Download the win-x64 release file (and another platform's, for its genuine cosign bundle)
        if: ${{ !cancelled() }}
        shell: bash
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/assets" --pattern 'denice-v*-win-x64.zip' --pattern 'denice-v*-linux-x64.zip'
      - name: Denice Runtime from the release accepts the genuine win-x64 release and refuses altered copies (rust/REQUIREMENTS.md E3)
        if: ${{ !cancelled() }}
        shell: bash
        run: eng/check-release-runtime.sh win-x64 "$RUNNER_TEMP/assets" "$RUNNER_TEMP/release-runtime"
