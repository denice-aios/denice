name: CI

# The full pipeline: the quality gate (build + test all six RIDs' code, run the four test legs, one gate job
# PRs must pass) PLUS, on a push to dev/main only, signing and a release.
#
# Version id: one leading `version` job computes it once (compute-version-once) and passes it to every OS job
# and the release job as -p:Denice* args / outputs, so all jobs stamp the identical id. dev => -pre-release,
# main => none.
#
# Signing (push only, decision signing-mechanisms): each OS job strong-name-signs its build (from the
# DENICE_STRONGNAME_SNK secret; DENICE_REQUIRE_SIGNED makes a missing key a hard fail so CI never ships
# unsigned — no-committed-keys), then codesign (mac) / signtool+timestamp (Windows) / cosign-keyless (all six)
# its two install layouts, checksum and cosign them, and upload them. The release job gathers all six and publishes one
# release: pre-release from dev, full release from main (channel-by-prerelease-id).
#
# What ships (Tim, 14-16 November 2026; rust/REQUIREMENTS.md): per platform one install layout, built by
# eng/build-install-layout.sh from ONE build id for both halves: the Rust loader `denice`, and versions/<version>/ with
# the versioned Rust entry `denice-v<version>-<rid>` (named by the build itself), Denice Runtime (.NET, a DLL) with its
# self-contained runtime, and the loader that version carries. Each OS job also runs the Rust gate (eng/rust-checks.sh)
# and the end-to-end loader test (eng/loader-e2e-test.sh) on its native platform.
#
# A single runner cannot host both `codesign` (macOS-only) and `signtool` (Windows-only), so each OS job
# verifies its own native signature right after signing (a hard `needs:` dependency of the release), and the
# release job — on macOS — re-verifies the mac codesign seals plus every cosign signature (the one cross-platform
# check). Nothing publishes if any of these fail (verify-sigs-before-publish).
#
# The .NET SDK version is read straight from global.json (dotnet-install --jsonfile) so the pin has ONE source (pin-sdk-10.0.100-ga, moved to the current patch after the macOS 26 upgrade); installed with Microsoft's official dotnet-install script,
# the same script used locally. Every third-party action is pinned by immutable commit id (pin-actions-by-commit-id).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.id.outputs.day }}
      time: ${{ steps.id.outputs.time }}
      combined: ${{ steps.id.outputs.combined }}
      hash: ${{ steps.id.outputs.hash }}
      channel: ${{ steps.id.outputs.channel }}
      # The single assembled version string (compute-build-id.sh is its sole owner): `tag` = MSBuild Version /
      # release tag (no +hash), `version` = SemVer / InformationalVersion (with +hash). Every downstream job
      # consumes these — no job re-reads version.props or re-applies -pre-release (compute-version-once).
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: id
        # pull_request => channel 'pr-<number>' (pr-build-version-channel: a PR build is not a pre-release, and the
        # number makes each build's evidence identifiable). push to dev => 'dev'; push to main => '' (no prerelease).
        run: eng/compute-build-id.sh "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/dev' && 'dev' || '') }}"

  macos:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable),
          # so it prints the exact pinned version and hard-fails if that version is not the one installed.
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/macos-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Build both mac install layouts (loader + versioned entry + Denice Runtime)
        run: |
          eng/build-install-layout.sh osx-arm64 layouts/osx-arm64
          eng/build-install-layout.sh osx-x64 layouts/osx-x64
      - name: Cross-RID selects exactly one platform library (host != target)
        # Regression guard for scan-resolutions #1: a self-contained cross-RID publish must reference and bundle
        # exactly ONE Denice.CrossPlatform.<OS> library. The per-OS legs can never catch a mis-selection
        # because each job's host matches its RID; this runs a TRUE cross-build (macOS host -> linux-x64 target).
        #
        # -m:1 (single MSBuild node) is load-bearing, not a preference. A self-contained cross-RID publish evaluates
        # the same projects twice — once with the RuntimeIdentifier set and once with the SDK's RID stripped for the
        # app's library references — and both instances write the SAME bin/Release/net10.0 output, because that path
        # does not vary by RID. Reproduced locally: a plain `dotnet build` builds every project once, while this
        # publish builds 5 of 7 twice. On parallel nodes the two writers can hit one generated file in the same
        # instant, which fails the step with "GenerateDepsFile ... deps.json ... used by another process" (seen on
        # the dev merge of PR #52, run 33440630677). Serializing removes the race; the underlying double-build is
        # issue #56, and this flag comes out when that is fixed.
        run: eng/check-single-platform-lib.sh linux-x64 -m:1 $AG
      - name: Test osx-arm64 (native)
        run: dotnet test -c Release $AG --logger "trx;LogFileName=macos-native.trx"
      - name: Test osx-x64 under Rosetta (must run as X64)
        # The detailed console logger surfaces ProcessArchitectureTests' "ProcessArchitecture=X64" line in the
        # CI log (Acceptance 6); DENICE_EXPECT_ARCH=X64 makes the test itself fail if this leg did not truly
        # land on x64 under Rosetta — teeth beyond a log grep (decision intel-mac-via-rosetta).
        env:
          DENICE_EXPECT_ARCH: X64
        run: |
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --architecture x64 --install-dir "$RUNNER_TEMP/dotnet-x64"
          DOTNET_ROOT="$RUNNER_TEMP/dotnet-x64" arch -x86_64 "$RUNNER_TEMP/dotnet-x64/dotnet" test -c Release $AG -l "console;verbosity=detailed" --logger "trx;LogFileName=macos-rosetta.trx"
      - name: Coverage gate — macOS implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # `dotnet test` collected cobertura coverage by default (the shared .runsettings). Gate the per-OS macOS
        # implementation on its own leg; the aggregate is gated once on the Linux leg.
        run: eng/coverage-gate.sh . Denice.CrossPlatform.MacOS
      - name: End-to-end loader test on osx-arm64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        run: eng/loader-e2e-test.sh osx-arm64 "$RUNNER_TEMP/e2e"
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-macos
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Sign mac binaries (codesign, hardened runtime + entitlements)
        if: github.event_name == 'push'
        env:
          P12_B64: ${{ secrets.DENICE_MACOS_CERT_P12 }}
          P12_PW: ${{ secrets.DENICE_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/macsign"; mkdir -p "$WORK"
          printf '%s' "$P12_B64" | openssl base64 -d -A > "$WORK/cert.p12"
          # ci-cert-expiry-check: fail the build if the CI signing cert is already expired. The p12->PEM
          # modern-then-legacy fallback lives in one place (eng/p12-to-pem.sh) shared with the release export.
          eng/p12-to-pem.sh "$WORK/cert.p12" "$P12_PW" "$WORK/cert.pem"
          if ! openssl x509 -in "$WORK/cert.pem" -checkend 0 -noout; then
            echo "::error::DENICE_MACOS_CERT_P12 is expired — regenerate the CI signing cert (decision ci-cert-expiry-check)."
            exit 1
          fi
          KC="$WORK/build.keychain-db"; KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$WORK/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -A
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          # The CI cert is a self-signed, UNTRUSTED code-signing cert, so `find-identity -v` (valid-only) returns
          # "0 valid identities found" (CSSMERR_TP_NOT_TRUSTED) and the old awk picked the word "valid", making
          # `codesign --sign valid` fail with "valid: no identity found". codesign does NOT need the cert trusted,
          # only present, so select the imported identity by its SHA-1 (list WITHOUT -v). codesign --verify --strict
          # (the verify step) is a structural seal check and likewise needs no trust.
          IDENTITY="$(security find-identity -p codesigning "$KC" | grep -oE '[0-9A-F]{40}' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "::error::No code-signing identity found in the build keychain after import."; exit 1; fi
          # Denice's own executables in each layout: the loader app Denice.app (root + the copy the version carries;
          # signing the app seals its program and Info.plist) and the versioned entry, which hosts .NET and so carries
          # the JIT entitlements (decision mac-hardened-runtime). The .NET runtime's own .dylib files keep Microsoft's
          # signatures.
          for rid in osx-arm64 osx-x64; do
            L="layouts/$rid"; V="$L/versions/$DENICE_ASSET_VERSION"
            for app in "$L/Denice.app" "$V/Denice.app"; do
              codesign --force --options runtime --keychain "$KC" --sign "$IDENTITY" "$app"
            done
            codesign --force --options runtime --entitlements eng/signing/denice.entitlements --keychain "$KC" --sign "$IDENTITY" "$V/denice-v$DENICE_ASSET_VERSION-$rid"
          done
      - name: Launch the codesigned mac layout (proves hardened runtime lets the loader, entry and .NET run)
        # success definition + Acceptance 5: run the codesigned, hardened-runtime osx-arm64 layout through its loader and
        # require exit 0 — the entry's entitlements (allow-jit / allow-unsigned-executable-memory) let it host .NET under
        # `codesign --options runtime` (decision mac-hardened-runtime).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          layouts/osx-arm64/Denice.app/Contents/MacOS/denice version
          rm -f "layouts/osx-arm64/versions/$DENICE_ASSET_VERSION/.started"
      - name: Stage, checksum, and cosign the mac layouts
        if: github.event_name == 'push'
        run: |
          eng/ci-stage-layout.sh layouts/osx-arm64 dist osx-arm64
          eng/ci-stage-layout.sh layouts/osx-x64 dist osx-x64
      - name: Verify mac signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        run: eng/ci-verify-layout.sh verify/verify-macos.txt codesign "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist osx-arm64 osx-x64
      - name: Upload signed mac binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload mac verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-macos
          path: verify/verify-macos.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JSonFile "$env:GITHUB_WORKSPACE/global.json" -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable).
          & "$env:RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        # bash (not the default pwsh) so $AG word-splits into separate -p args, matching the mac/linux jobs;
        # under pwsh "$env:AG" is passed as ONE malformed argument and DeniceStampVersion fails the build.
        shell: bash
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/windows-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Build both windows install layouts (loader + versioned entry + Denice Runtime)
        shell: bash
        run: |
          eng/build-install-layout.sh win-x64 layouts/win-x64
          eng/build-install-layout.sh win-arm64 layouts/win-arm64
      - name: Test win-x64 (win-arm64 is build-only, accepted risk)
        shell: bash
        run: dotnet test -c Release $AG --logger "trx;LogFileName=windows.trx"
      - name: Coverage gate — Windows implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # bash so the shared gate script runs identically to the mac/linux legs. It gates the per-OS Windows
        # implementation on its own leg; the aggregate is gated once on the Linux leg.
        shell: bash
        run: eng/coverage-gate.sh . Denice.CrossPlatform.Windows
      - name: End-to-end loader test on win-x64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        shell: bash
        run: eng/loader-e2e-test.sh win-x64 "$RUNNER_TEMP/e2e"
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-windows
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Sign windows binaries (Authenticode + RFC3161 timestamp)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DENICE_WINDOWS_PFX }}
          PFX_PW: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'winsign'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pfx = Join-Path $work 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 @($pfx, $env:PFX_PW)
          # ci-cert-expiry-check: fail the build if the CI signing cert is already expired.
          if ($cert.NotAfter -lt (Get-Date)) {
            Write-Error "DENICE_WINDOWS_PFX is expired ($($cert.NotAfter)) — regenerate the CI signing cert (decision ci-cert-expiry-check)."
          }
          # Install our self-signed cert into this ephemeral runner's trust store so `signtool verify /pa` chains.
          # This is the RUNNER, not a tester's machine — the tester 'never Root' rule (tester-trust-public-cer)
          # governs end users, who use eng/signing/trust-cert.ps1 (Trusted Publishers only).
          $der = Join-Path $work 'public.cer'
          [IO.File]::WriteAllBytes($der, $cert.Export('Cert'))
          Import-Certificate -FilePath $der -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $der -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error 'signtool.exe not found on the runner.' }
          # Denice's own files in each layout: the loader (root + carried copy), the versioned entry and the Denice.*.dll
          # assemblies. The .NET runtime's own files keep Microsoft's signatures.
          foreach ($rid in 'win-x64','win-arm64') {
            $layout = "layouts\$rid"; $version = Join-Path $layout "versions\$env:DENICE_ASSET_VERSION"
            $files = @((Join-Path $layout 'denice.exe'), (Join-Path $version 'denice.exe'),
                       (Join-Path $version "denice-v$env:DENICE_ASSET_VERSION-$rid.exe")) +
                     @(Get-ChildItem -Path $version -Filter 'Denice.*.dll' | ForEach-Object FullName)
            foreach ($bin in $files) {
              # Timestamp against DigiCert; on failure fall back to Sectigo (decision digicert-timestamp-sectigo-fallback).
              & $signtool sign /fd sha256 /f $pfx /p $env:PFX_PW /tr http://timestamp.digicert.com /td sha256 $bin
              if ($LASTEXITCODE -ne 0) {
                Write-Host 'DigiCert timestamp unavailable; falling back to Sectigo.'
                & $signtool sign /fd sha256 /f $pfx /p $env:PFX_PW /tr http://timestamp.sectigo.com /td sha256 $bin
                if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed for $bin on both timestamp servers." }
              }
            }
          }
      - name: Stage, checksum, and cosign the windows layouts
        if: github.event_name == 'push'
        shell: bash
        run: |
          eng/ci-stage-layout.sh layouts/win-x64 dist win-x64
          eng/ci-stage-layout.sh layouts/win-arm64 dist win-arm64
      - name: Verify windows signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        shell: bash
        run: eng/ci-verify-layout.sh verify/verify-windows.txt signtool "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist win-x64 win-arm64
      - name: Upload signed windows binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload windows verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-windows
          path: verify/verify-windows.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write            # cosign keyless (ambient GitHub OIDC) on a push
    env:
      AG: -p:DeniceDay=${{ needs.version.outputs.day }} -p:DeniceTime=${{ needs.version.outputs.time }} -p:DeniceCombined=${{ needs.version.outputs.combined }} -p:DeniceHash=${{ needs.version.outputs.hash }} -p:DeniceChannel=${{ needs.version.outputs.channel }} -p:DeniceTag=${{ needs.version.outputs.tag }} -p:DeniceVersion=${{ needs.version.outputs.version }}
      # Release file names carry the full build version (Tim, pkg-fcfb11e1ba8c semver-form b): denice-v<version>-<rid>.
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      # The same build id for eng/build-install-layout.sh, which stamps .NET (-p:Denice*) and Rust (DENICE_VERSION) alike.
      DENICE_DAY: ${{ needs.version.outputs.day }}
      DENICE_TIME: ${{ needs.version.outputs.time }}
      DENICE_COMBINED: ${{ needs.version.outputs.combined }}
      DENICE_HASH: ${{ needs.version.outputs.hash }}
      DENICE_CHANNEL: ${{ needs.version.outputs.channel }}
      DENICE_TAG: ${{ needs.version.outputs.tag }}
      DENICE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned .NET SDK (official script, same as local)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile "$GITHUB_WORKSPACE/global.json" --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          # Explicit proof of the SDK this leg builds with — resolved through global.json (rollForward disable),
          # so it prints the exact pinned version and hard-fails if that version is not the one installed.
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - name: Restore the strong-name signing key (push only; CI must ship signed)
        if: github.event_name == 'push'
        shell: bash
        env:
          DENICE_STRONGNAME_SNK: ${{ secrets.DENICE_STRONGNAME_SNK }}
          DENICE_STRONGNAME_PUBLICKEY: ${{ secrets.DENICE_STRONGNAME_PUBLICKEY }}
        run: |
          eng/ci-restore-signing-key.sh
          echo "DENICE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build (the lint/analyzer gate too)
        run: |
          mkdir -p evidence
          dotnet build -c Release $AG -bl:evidence/linux-build.binlog
      - name: Install the pinned Rust toolchain (rust/rust-toolchain.toml) and the coverage tool
        # The toolchain pin has ONE source, rust/rust-toolchain.toml (as global.json pins the .NET SDK): rustup reads it
        # and installs that exact version with its components and all six targets. cargo-llvm-cov is pinned here.
        shell: bash
        run: |
          cd rust && rustup toolchain install && rustc --version && cargo --version
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          # The custom rules (dylint, pkg-697310396f74) build on their own pinned nightly with rustc-dev.
          ( cd lints/denice_rules && rustup toolchain install )
          cargo install cargo-dylint dylint-link --version 6.4.0 --locked
      - name: Rust gate — format, lint (warnings are errors), tests, coverage ≥ 75%, custom rules R1-R12 (rust/REQUIREMENTS.md F4 F5 F7 F8)
        shell: bash
        run: eng/rust-checks.sh evidence/rust-coverage-${{ runner.os }}.lcov
      - name: Build both linux install layouts (loader + versioned entry + Denice Runtime)
        # This runner is arm64; the x86_64 Rust programs link with the cross linker.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-x86-64-linux-gnu
          eng/build-install-layout.sh linux-arm64 layouts/linux-arm64
          eng/build-install-layout.sh linux-x64 layouts/linux-x64
      - name: The Linux Rust programs need no newer glibc than Denice Runtime's .NET (rust/REQUIREMENTS.md F12)
        run: |
          sudo apt-get install -y -q binutils-x86-64-linux-gnu
          eng/check-glibc.sh layouts/linux-arm64 linux-arm64
          OBJDUMP=x86_64-linux-gnu-objdump eng/check-glibc.sh layouts/linux-x64 linux-x64
      - name: Test linux-arm64 (linux-x64 is build-only, accepted risk)
        run: dotnet test -c Release $AG --logger "trx;LogFileName=linux.trx"
      - name: Coverage gate — aggregate + Linux implementation ≥ 75% (decisions threshold-75-hard-gate, covered-assemblies)
        # The Linux leg is where the aggregate of Engine + Cli (denice) + CrossPlatform is gated (computed once),
        # alongside the per-OS Linux implementation. `dotnet test` collected coverage by default.
        run: eng/coverage-gate.sh . aggregate Denice.CrossPlatform.Linux
      - name: End-to-end loader test on linux-arm64 (install, update, loader replacement, fallback; rust/REQUIREMENTS.md E1)
        run: eng/loader-e2e-test.sh linux-arm64 "$RUNNER_TEMP/e2e"
      - name: Upload build evidence (coverage + test results + binlog)
        # ci-uploads-build-evidence / evidence-on-pr-builds: runs on pull_request AND push, success AND failure
        # (if: always(), never push-gated) so a failing leg's diagnostics are downloadable. Evidence carries no
        # binaries or signing material — a different risk class than the push-only signed artifacts below.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-linux
          if-no-files-found: warn
          retention-days: 7
          path: |
            evidence/*.binlog
            evidence/*.lcov
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/*.trx
      - name: Install cosign (keyless signing)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Stage, checksum, and cosign the linux layouts (no native code-signing on Linux)
        if: github.event_name == 'push'
        run: |
          eng/ci-stage-layout.sh layouts/linux-arm64 dist linux-arm64
          eng/ci-stage-layout.sh layouts/linux-x64 dist linux-x64
      - name: Verify linux signatures + record result artifact (verify-sigs-before-publish)
        if: github.event_name == 'push'
        run: eng/ci-verify-layout.sh verify/verify-linux.txt none "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" dist linux-arm64 linux-x64
      - name: Upload signed linux binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload linux verify result
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-linux
          path: verify/verify-linux.txt
          if-no-files-found: error
          retention-days: 7

  # The single check branch protection requires. It goes green only if all three OS jobs succeeded — a
  # skipped or failed OS job cannot green it.
  gate:
    needs: [macos, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every loader requirement is done with evidence (rust/REQUIREMENTS.md E2; nothing is dropped quietly)
        run: eng/check-requirements.sh
      - name: Assert every OS job succeeded
        run: |
          echo "macos=${{ needs.macos.result }} windows=${{ needs.windows.result }} linux=${{ needs.linux.result }}"
          test "${{ needs.macos.result }}" = "success" \
            && test "${{ needs.windows.result }}" = "success" \
            && test "${{ needs.linux.result }}" = "success"

  # Publishes ONE release from the six signed binaries — pre-release from dev, full release from main. Runs only
  # on a push (PRs publish nothing) and only after the gate is green (needs: gate). On macOS so it can re-verify
  # the mac codesign seals; cosign verify-blob covers all six. The assets are packaged as zips (release-zip-layout):
  # one denice-v<version>-<rid>.zip per binary plus one evidence.zip with a subdirectory per OS/platform build.
  release:
    needs: [version, gate, macos, windows, linux]
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # The assembled release tag from the single owner (the `version` job) — the release NEVER re-reads
      # version.props or re-applies -pre-release (compute-version-once / release-fields).
      TAG: ${{ needs.version.outputs.tag }}
      DENICE_ASSET_VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign (for verify-blob)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.1.3)
        with:
          cosign-release: 'v3.1.3'
      - name: Download all six signed install layouts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Download the three per-platform verify results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verify-*
          path: verify
          merge-multiple: true
      - name: Download the per-OS build evidence (for evidence.zip)
        # No merge-multiple: each artifact lands in its own subdir (evidence-artifacts/evidence-<os>), which the
        # packaging step reorganizes into evidence.zip's one-subdirectory-per-OS-build layout (release-zip-layout).
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-*
          path: evidence-artifacts
      - name: Require every per-platform verify result present and PASS (verify-sigs-before-publish)
        # Each per-OS job proved its own native signatures and emitted verify-<os>.txt. Refuse to publish unless
        # all three exist and each ends with "RESULT: PASS" — a missing or non-PASS result blocks the release.
        run: |
          set -euo pipefail
          for os in macos windows linux; do
            f="verify/verify-$os.txt"
            if [ ! -f "$f" ]; then
              echo "::error::Missing per-platform verify result $f — refusing to publish (verify-sigs-before-publish)."
              exit 1
            fi
            echo "== $f =="
            cat "$f"
            if ! grep -q "^RESULT: PASS$" "$f"; then
              echo "::error::$f is not PASS — refusing to publish (verify-sigs-before-publish)."
              exit 1
            fi
          done
      - name: Re-verify every signature before publishing (single-owner verify script)
        # verify-sigs-before-publish: re-run the SAME verifier the per-OS jobs used (eng/ci-verify-layout.sh)
        # so the cosign/codesign commands and the keyless identity have exactly one owner. cosign covers all six;
        # codesign covers the two mac RIDs (this runner is macOS). Windows Authenticode was verified in the
        # windows job, a hard `needs:` dependency of this job — no single runner hosts codesign + signtool. The
        # identity uses the same `@${{ github.ref }}` form the per-OS legs pass.
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"
          eng/ci-verify-layout.sh verify/release-macos.txt   codesign "$IDENTITY" dist osx-arm64 osx-x64
          eng/ci-verify-layout.sh verify/release-windows.txt none     "$IDENTITY" dist win-x64 win-arm64
          eng/ci-verify-layout.sh verify/release-linux.txt   none     "$IDENTITY" dist linux-arm64 linux-x64
      - name: Export the two public certs from their secrets (never drift)
        env:
          MAC_P12_B64: ${{ secrets.DENICE_MACOS_CERT_P12 }}
          MAC_P12_PW: ${{ secrets.DENICE_MACOS_CERT_PASSWORD }}
          WIN_PFX_B64: ${{ secrets.DENICE_WINDOWS_PFX }}
          WIN_PFX_PW: ${{ secrets.DENICE_WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          export_cer() { # <b64> <pw> <out.cer>
            local b64="$1" pw="$2" out="$3" tmp
            tmp="$(mktemp -d)"
            printf '%s' "$b64" | openssl base64 -d -A > "$tmp/in.p12"
            # Shared p12->PEM modern-then-legacy fallback (same helper the mac cert-expiry check uses).
            eng/p12-to-pem.sh "$tmp/in.p12" "$pw" "$tmp/cert.pem"
            openssl x509 -in "$tmp/cert.pem" -outform DER -out "$out"
            rm -rf "$tmp"
          }
          export_cer "$MAC_P12_B64" "$MAC_P12_PW" dist/denice-macos-public.cer
          export_cer "$WIN_PFX_B64" "$WIN_PFX_PW" dist/denice-windows-public.cer
      - name: Stage the tester trust scripts
        run: cp eng/signing/trust-cert.sh eng/signing/trust-cert.ps1 dist/
      - name: Package the evidence zip (release-zip-layout)
        # release-zip-layout: the per-OS jobs already produced one denice-v<version>-<rid>.zip per platform (the install
        # layout, with versions/<version>/SHA256SUMS and its cosign bundle inside, the zip's own .zip.sha256 beside it).
        # Here: one evidence.zip organized with one subdirectory per OS/platform build.
        run: |
          set -euo pipefail
          rm -rf evidence-zip-root
          for os in macos windows linux; do
            src="evidence-artifacts/evidence-$os"
            if [ ! -d "$src" ]; then
              echo "::error::missing $src — the release would silently omit $os from evidence.zip" >&2
              exit 1
            fi
            mkdir -p "evidence-zip-root/$os"
            cp -R "$src/." "evidence-zip-root/$os/"
          done
          ( cd evidence-zip-root && zip -r "../dist/evidence.zip" . )
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # VERSION/tag is consumed from the single owner (the `version` job's `tag` output) — already
          # MM.combined[-pre-release] with NO +hash (decision release-fields). Only the release-kind labels are
          # derived from the channel here; the version string itself is never re-assembled.
          if [ "$CHANNEL" = "dev" ]; then
            PRERELEASE="--prerelease"; KIND="dev preview"; CHANNEL_LINE="dev preview (pre-release)"
          else
            PRERELEASE=""; KIND="release"; CHANNEL_LINE="release"
          fi
          VERSION="$TAG"
          TITLE="Denice ${VERSION} (${KIND})"
          REPO="${{ github.repository }}"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            printf 'Channel: %s\n\n' "$CHANNEL_LINE"
            printf 'These binaries are signed with a self-signed, UNTRUSTED developer certificate — not a CA-issued or notarized identity. Trust our public certificate first with the attached tester trust script (`trust-cert.sh` on macOS, `trust-cert.ps1` on Windows); it trusts the cert narrowly for code signing only, never as a root.\n\n'
            printf 'How to run these alpha builds: https://github.com/%s/blob/%s/docs/running-alpha-builds.md\n\n' "$REPO" "$GITHUB_SHA"
            printf 'Built, tested, and signed from commit: https://github.com/%s/commit/%s\n' "$REPO" "$GITHUB_SHA"
          } > "$NOTES"
          cd dist
          gh release create "$VERSION" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            $PRERELEASE \
            "denice-v${DENICE_ASSET_VERSION}"-{osx-arm64,osx-x64,win-x64,win-arm64,linux-arm64,linux-x64}.zip \
            "denice-v${DENICE_ASSET_VERSION}"-{osx-arm64,osx-x64,win-x64,win-arm64,linux-arm64,linux-x64}.zip.sha256 \
            evidence.zip \
            denice-macos-public.cer denice-windows-public.cer \
            trust-cert.sh trust-cert.ps1
